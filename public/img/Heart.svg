    M 4,2 h 3 v 1 h 2 v -1 h 3 v 1 
    h 1 v 1 h 1 v 1 h 1 v 4 h -1 
    v 1 h -1 v 1 h -1 v 1 h -1 v 1 
    h -1 v 1 h -2 v -1 h -1 v -1 h -1 
    v -1 h -1 v -1 h -1 v -1 h -1 v -4 
